name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - prefix: cpu
            base: ghcr.io/ggml-org/llama.cpp:server
          # For GPU hosts. Run it with LLAMA_NGL set, otherwise llama.cpp holds the GPU and
          # still runs on the CPU.
          - prefix: cuda
            base: ghcr.io/ggml-org/llama.cpp:server-cuda
        arch:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    runs-on: ${{ matrix.arch.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.arch.platform }}
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant.prefix }}-${{ matrix.arch.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - prefix: cpu
          - prefix: cuda

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.variant.prefix }}-
            type=raw,value=${{ matrix.variant.prefix }},enable={{is_default_branch}}

      - name: Create multi-arch manifest
        run: |
          while IFS= read -r TAG; do
            docker buildx imagetools create -t "${TAG}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant.prefix }}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant.prefix }}-arm64
          done <<< "${DOCKER_METADATA_OUTPUT_TAGS}"
