name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6

      - run: go vet ./...
      - run: go test ./...

      # The image is the product, so a broken Dockerfile should fail the pull request.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
